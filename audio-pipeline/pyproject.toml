[project]
name = "tunely-audio-pipeline"
version = "0.1.0"
description = "Pipeline local de reconstrução de conteúdo de áudio (inventário, ASR, alinhamento, segmentação, tradução, exportação)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx-whisper",
    "whisperx",
    "anthropic",
    "jsonschema",
    "wordfreq>=3.1",
    "pillow>=13.0.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
